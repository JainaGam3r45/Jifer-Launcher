[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["JainaGam3r45"]
repository = "https://github.com/JainaGam3r45/Jifer-Launcher"
publish = false

[workspace.dependencies]
jifercraft-auth = { path = "crates/jifercraft-auth" }
jifercraft-core = { path = "crates/jifercraft-core" }
jifercraft-net = { path = "crates/jifercraft-net" }
jifercraft-updater = { path = "crates/jifercraft-updater" }

futures = "0.3.34"
keyring = "4.2.0"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "env-filter", "ansi"] }
hex = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "form", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
